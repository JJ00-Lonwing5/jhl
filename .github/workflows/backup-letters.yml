name: Backup Letters

# 每天自动把 restdb 的留言备份到本仓库 backups/letters.json
on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:       # 也可以在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch letters from restdb
        run: |
          mkdir -p backups
          curl -s -f -H "x-apikey: 6adf364f0f7a29b5dd8bd265" \
            "https://lettershanlin-cc8d.restdb.io/rest/letters?sort=time&dir=-1&max=1000" \
            -o backups/letters.json
          echo "--- backup content ---"
          cat backups/letters.json

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/letters.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "自动备份来信 $(date +%Y-%m-%d)"
            git push
          fi
