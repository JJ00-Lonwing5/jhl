<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="静帧 · 嵇翰林 HANLIN JI 的个人网站。旅行、音乐、电影，以及一些安静的时光。">
  <meta name="theme-color" content="#f4f1ea">
  <title>静帧 · Still Frame — 嵇翰林</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <main id="main" class="cover">
    <div class="cover__inner">
      <p class="kicker kicker--russet">STILL FRAME · A PERSONAL ARCHIVE</p>
      <h1 class="cover__brand">静帧</h1>
      <p class="cover__brand-en">STILL FRAME</p>
      <p class="cover__sub">Travel, Music, Film —<br>and some quiet moments in between.</p>
      <p class="cover__sub-cn">旅行、音乐、电影，以及一些安静的时光。</p>
      <p class="cover__name">HANLIN JI · 嵇翰林</p>

      <div class="cover__entry">
        <span class="opening-credits">Opening Credits</span>
        <a class="enter-btn" href="journal1.html">
          进入
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </div>

    <!-- 唱片场景（纯装饰） -->
    <div class="vinyl-scene" aria-hidden="true">
      <div class="vinyl">
        <div class="vinyl__disc">
          <div class="vinyl__label">
            <img src="assets/portrait1.jpg" alt="占位照片：此处可替换为嵇翰林本人照片">
          </div>
          <div class="vinyl__hole"></div>
        </div>
      </div>
      <div class="tonearm">
        <div class="tonearm__pivot"></div>
        <div class="tonearm__arm"></div>
        <div class="tonearm__head"></div>
        <div class="tonearm__needle"></div>
      </div>
    </div>

    <!-- 咖啡杯（唱片另一侧，不旋转） -->
    <div class="coffee" aria-hidden="true">
      <span class="coffee__steam"></span>
      <span class="coffee__steam"></span>
      <span class="coffee__steam"></span>
      <div class="coffee__handle"></div>
      <div class="coffee__cup"></div>
      <div class="coffee__saucer"></div>
    </div>
  </main>

  <script src="app1.js"></script>
</body>
</html>
